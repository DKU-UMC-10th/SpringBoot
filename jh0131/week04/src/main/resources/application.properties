## Basic application configuration

# Use an in‑memory H2 database for local development.  Spring Boot will
# automatically configure a DataSource from this URL and initialize the JPA
# EntityManager using the entities defined in the domain packages.
spring.datasource.url=jdbc:h2:mem:missiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Automatically create and update database schema based on JPA entities.  In
# production environments you might prefer to use a tool like Flyway or
# Liquibase instead of relying on JPA’s ddl‑auto feature.
spring.jpa.hibernate.ddl-auto=update

# Show SQL statements in the console to simplify debugging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set the logging level for our application.  INFO is a reasonable default
# while developing.
logging.level.root=INFO